name: CI

# publish.yml sólo dispara con tags: hasta acá nadie corría la suite en un push
# ni en un PR, así que una regresión sólo aparecía en el momento de publicar —
# cuando ya es tarde para no publicarla.
on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck y tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile
      - name: Auditar dependencias
        run: bun audit
      - name: Lint
        run: bun run lint
      - run: bun run typecheck
      - name: Tests
        run: bun test --parallel --timeout 30000
      - name: Verificar que la suite no tocó la base real
        shell: bash
        run: |
          # test/preload.ts fija HIVE_DB_PATH=":memory:". Si algún import resuelve
          # la ruta antes del preload, la suite le escribe a la base del usuario.
          # En CI no se nota —~/.hive no existe— salvo que se compruebe.
          test ! -e "$HOME/.hive/data/hivedb"

  scaffold:
    name: El scaffold generado compila
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile
      - name: Generar una app y typecheckearla contra el SDK de este commit
        shell: bash
        run: |
          # Lo que recibe un usuario nuevo: si `hives create-app` produce algo que
          # no compila, la suite igual pasa y el error aparece del otro lado.
          #
          # El `bun link` no es cosmético: sin él, `bun install` en el scaffold se
          # baja @johpaz/hive-sdk de npm y el job valida la versión YA publicada,
          # no la de este commit — pasaría en verde justo cuando el cambio rompe
          # la plantilla.
          bun link
          bun packages/cli/src/index.ts create-app ci-demo
          cd ci-demo
          bun install
          bun link @johpaz/hive-sdk
          bunx tsc --noEmit

  browser:
    name: Tests del navegador (Chrome real)
    runs-on: ubuntu-latest
    # No bloquea: dependen de Chrome y de la red del runner. Existen para que el
    # `WebViewBackend` y las tools de navegador se ejecuten alguna vez en CI en vez
    # de quedar siempre omitidos (91 tests, activados con BROWSER_TESTS=1).
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - uses: browser-actions/setup-chrome@v1
        id: chrome
      - run: bun install --frozen-lockfile
      # Los runners de Ubuntu 24.04 restringen los user namespaces (AppArmor) y
      # Chrome no arranca con su sandbox; mismo wrapper que usa el Dockerfile.
      - name: Chrome sin sandbox
        run: |
          printf '#!/bin/sh\nexec "%s" --no-sandbox --disable-dev-shm-usage "$@"\n' "${{ steps.chrome.outputs.chrome-path }}" > "$RUNNER_TEMP/chrome-nosandbox"
          chmod +x "$RUNNER_TEMP/chrome-nosandbox"
          "$RUNNER_TEMP/chrome-nosandbox" --version
      - name: Tests del navegador
        env:
          BROWSER_TESTS: "1"
          BUN_CHROME_PATH: ${{ runner.temp }}/chrome-nosandbox
        run: bun test test/browser-backend.test.ts test/browser-cdp.test.ts test/browser-session-persistence.test.ts test/browser-bun.test.ts --timeout 60000
